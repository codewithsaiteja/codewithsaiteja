<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="900" height="300" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2" />

  <!-- Top System Header Bar -->
  <rect x="1" y="1" width="898" height="46" rx="8" fill="#ffffff" />
  <rect x="1" y="30" width="898" height="17" fill="#ffffff" />
  <line x1="0" y1="47" x2="900" y2="47" stroke="#d0d7de" stroke-width="1" />

  <!-- Top Bar Metrics -->
  <circle cx="34" cy="24" r="4.5" fill="#1a7f37" />
  <text x="46" y="28" fill="#1a7f37" class="mono" font-size="11" font-weight="600" letter-spacing="1">SYSTEM OPERATIONAL</text>
  <text x="215" y="28" fill="#8c959f" class="mono" font-size="11">|</text>
  <text x="228" y="28" fill="#57606a" class="mono" font-size="11" letter-spacing="1">LATENCY: NOMINAL</text>

  <text x="450" y="28" text-anchor="middle" fill="#24292f" class="mono" font-size="11" font-weight="600" letter-spacing="1.5">SAI TEJA // ENGINEERING SYSTEM</text>

  <text x="866" y="28" text-anchor="end" fill="#57606a" class="mono" font-size="11" letter-spacing="1">NODE // CODEWITHSAITEJA</text>

  <!-- Left Identity Column -->
  <g transform="translate(36, 74)">
    <text x="0" y="14" fill="#0969da" class="mono" font-size="11" font-weight="600" letter-spacing="2">SOFTWARE ENGINEER &amp; BUILDER</text>
    <text x="0" y="52" fill="#1f2328" class="sans" font-size="30" font-weight="700" letter-spacing="0.5">SAI TEJA REDDY</text>
    <text x="0" y="80" fill="#424a53" class="sans" font-size="14" font-weight="500">Co-Founder &amp; CTO — Odessi.tfi</text>

    <!-- Track Pills -->
    <text x="0" y="118" fill="#57606a" class="mono" font-size="10" font-weight="600" letter-spacing="1">CORE DISCIPLINES</text>

    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="138" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
      <text x="69" y="17" text-anchor="middle" fill="#24292f" class="mono" font-size="11">FULL-STACK</text>

      <rect x="146" y="0" width="158" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
      <text x="225" y="17" text-anchor="middle" fill="#24292f" class="mono" font-size="11">AI APPLICATIONS</text>

      <rect x="312" y="0" width="168" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />
      <text x="396" y="17" text-anchor="middle" fill="#24292f" class="mono" font-size="11">PRODUCT SYSTEMS</text>
    </g>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(534, 68)">
    <rect x="0" y="0" width="330" height="178" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />

    <!-- Panel Header -->
    <rect x="0" y="0" width="330" height="32" rx="6" fill="#f6f8fa" />
    <rect x="0" y="20" width="330" height="12" fill="#f6f8fa" />
    <line x1="0" y1="32" x2="330" y2="32" stroke="#d0d7de" stroke-width="1" />
    <text x="14" y="21" fill="#24292f" class="mono" font-size="11" font-weight="600" letter-spacing="1.2">SYSTEM SPECIFICATION</text>
    <text x="316" y="21" text-anchor="end" fill="#1a7f37" class="mono" font-size="10" font-weight="600">● ACTIVE</text>

    <!-- Telemetry Entries -->
    <g transform="translate(14, 52)">
      <text x="0" y="0" fill="#57606a" class="mono" font-size="11" letter-spacing="1">ROLE</text>
      <text x="95" y="0" fill="#1f2328" class="sans" font-size="12" font-weight="600">Co-Founder &amp; CTO</text>

      <text x="0" y="25" fill="#57606a" class="mono" font-size="11" letter-spacing="1">CURRENT</text>
      <text x="95" y="25" fill="#0969da" class="sans" font-size="12" font-weight="600">Odessi.tfi</text>

      <text x="0" y="50" fill="#57606a" class="mono" font-size="11" letter-spacing="1">FOCUS</text>
      <text x="95" y="50" fill="#424a53" class="sans" font-size="12">Full-Stack + Applied AI</text>

      <text x="0" y="75" fill="#57606a" class="mono" font-size="11" letter-spacing="1">LOCATION</text>
      <text x="95" y="75" fill="#424a53" class="sans" font-size="12">India</text>

      <text x="0" y="100" fill="#57606a" class="mono" font-size="11" letter-spacing="1">PORTFOLIO</text>
      <text x="95" y="100" fill="#0969da" class="mono" font-size="11">saitejareddy-portfolio.vercel.app</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <line x1="0" y1="262" x2="900" y2="262" stroke="#d0d7de" stroke-width="1" />
  <text x="36" y="282" fill="#57606a" class="mono" font-size="10" letter-spacing="1">TECH: REACT · NEXT.JS · NODE.JS · JAVA · MONGO · GROQ AI</text>
  <text x="864" y="282" text-anchor="end" fill="#57606a" class="mono" font-size="10" letter-spacing="1">BUILDING RESILIENT SOFTWARE SYSTEMS</text>
</svg>
