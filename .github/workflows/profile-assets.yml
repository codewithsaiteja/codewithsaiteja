name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: codewithsaiteja
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      - name: Generate GitHub stats
        run: |
          curl -L \
            "https://github-readme-stats.vercel.app/api?username=codewithsaiteja&show_icons=true&theme=tokyonight&hide_border=true" \
            -o profile/stats.svg

      - name: Generate top languages
        run: |
          curl -L \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=codewithsaiteja&layout=compact&langs_count=8&theme=tokyonight&hide_border=true" \
            -o profile/top-langs.svg

      - name: Generate activity graph
        run: |
          curl -L \
            "https://github-readme-activity-graph.vercel.app/graph?username=codewithsaiteja&theme=github-compact&hide_border=true" \
            -o profile/activity.svg

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No profile asset changes."
          else
            git commit -m "chore: update GitHub profile assets"
            git push
          fi
