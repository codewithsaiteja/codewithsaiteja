name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      # ── Contribution Snake ──────────────────────────────────────────────
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: codewithsaiteja
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      - name: Validate snake SVGs
        run: |
          for f in profile/github-snake.svg profile/github-snake-dark.svg; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not generated"; exit 1
            fi
            if ! grep -q '<svg' "$f"; then
              echo "ERROR: $f does not appear to be a valid SVG"; exit 1
            fi
            echo "OK: $f"
          done

      # ── GitHub Stats (lowlighter/metrics — runs fully in CI, no external service) ──
      - name: Generate GitHub stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: codewithsaiteja
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: profile/stats.svg
          config_output: svg
          config_display: large
          extras_css: |
            :root { --color-border: transparent; }

      - name: Generate top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: codewithsaiteja
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          filename: profile/top-langs.svg
          config_output: svg
          config_display: large
          extras_css: |
            :root { --color-border: transparent; }

      - name: Validate stats SVGs
        run: |
          for f in profile/stats.svg profile/top-langs.svg; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not generated"; exit 1
            fi
            if ! grep -q '<svg' "$f"; then
              echo "ERROR: $f does not appear to be a valid SVG (may be an HTML error page)"; exit 1
            fi
            echo "OK: $f"
          done

      # ── Commit ──────────────────────────────────────────────────────────
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No profile asset changes."
          else
            git commit -m "chore: update GitHub profile assets"
            git push
          fi
