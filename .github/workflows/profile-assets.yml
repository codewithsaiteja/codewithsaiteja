name: Update GitHub Profile Assets

on:
  schedule:
    # Run automatically every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure profile directory exists
        run: mkdir -p profile

      # ── 2. Contribution Snake ────────────────────────────────────────────
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: codewithsaiteja
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      # ── 3. Validate SVGs ────────────────────────────────────────────────
      - name: Validate generated SVGs
        run: |
          FAILED=0
          for f in profile/github-snake.svg profile/github-snake-dark.svg; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not generated"
              FAILED=1
            elif ! grep -q '<svg' "$f"; then
              echo "ERROR: $f does not contain valid SVG content"
              FAILED=1
            else
              SIZE=$(wc -c < "$f")
              echo "OK: $f (${SIZE} bytes)"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      # ── 4. Commit and Push ──────────────────────────────────────────────
      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-snake*.svg

          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
          else
            git commit -m "chore: update GitHub profile assets"
            git push
          fi
