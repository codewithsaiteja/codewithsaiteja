name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      # ── 2. Contribution Snake ────────────────────────────────────────────
      #    Reads codewithsaiteja's contribution grid via GitHub API and
      #    renders it as an animated SVG. No commit happens here.
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: codewithsaiteja
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      # ── 3. GitHub Stats card ─────────────────────────────────────────────
      #    output_action: none  →  writes file to workspace only, does NOT
      #    commit or push independently.
      - name: Generate GitHub stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: codewithsaiteja
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: profile/stats.svg
          config_output: svg
          config_display: large
          output_action: none

      # ── 4. Top Languages card ────────────────────────────────────────────
      #    output_action: none  →  writes file to workspace only, does NOT
      #    commit or push independently.
      - name: Generate top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: codewithsaiteja
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          filename: profile/top-langs.svg
          config_output: svg
          config_display: large
          output_action: none

      # ── 5. Validate all four SVGs ────────────────────────────────────────
      #    Fail immediately if any file is missing or is an HTML error page.
      - name: Validate generated SVGs
        run: |
          FAILED=0
          for f in profile/github-snake.svg profile/github-snake-dark.svg profile/stats.svg profile/top-langs.svg; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f was not generated"
              FAILED=1
            elif ! grep -q '<svg' "$f"; then
              echo "ERROR: $f does not contain valid SVG content (possible HTML error page)"
              FAILED=1
            else
              SIZE=$(wc -c < "$f")
              echo "OK: $f (${SIZE} bytes)"
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      # ── 6. Single commit + push ──────────────────────────────────────────
      #    This is the ONE AND ONLY place that commits and pushes.
      #    All four SVGs are staged and pushed together.
      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No profile asset changes to commit."
          else
            git commit -m "chore: update GitHub profile assets"
            git push
          fi
